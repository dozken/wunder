# Paths are relative to this directory. The starter pack extracts here as
# wnn_connectome_starterpack/ and is gitignored.

[env]
SP = "wnn_connectome_starterpack"

[tasks.fetch-data]
description = "Stream and extract the 33.7 GB starter pack into this directory"
run = "curl -L --retry 5 --retry-delay 5 --retry-all-errors https://files.wundernn.io/wnn_connectome_starterpack.tar.gz | tar -xz"

[tasks.score-baseline]
description = "Score the provided GRU baseline on the full validation set (expect 0.589595 WP)"
run = "python $SP/baseline/solution.py --validation $SP/datasets/valid.parquet"

[tasks.bench]
description = "Measure per-row inference latency against the 60 min / 1 vCPU budget"
run = "python src/bench.py"

[tasks.eda]
description = "Print a first-look summary of a random sample of sequences"
run = "python src/eda.py"

[tasks.train]
description = "Train a model: mise run train -- --tag NAME [train.py args]"
run = "python src/train.py"

[tasks.export]
description = "Export a checkpoint to ONNX with parity check: mise run export -- runs/NAME/best.pt src/model_a.onnx"
run = "python src/export.py"

[tasks.score]
description = "Score a checkpoint on the full validation set: mise run score -- --checkpoint runs/NAME/best.pt"
run = "python src/score.py"

[tasks.score-strict]
description = "Drive src/solution.py through the organisers' row-by-row scorer on 20 sequences"
run = "python src/score.py --strict --seqs 20"

[tasks.docker-build]
description = "Build the scorer Docker image"
run = "docker build -t wnn-connectome-scorer -f docker/Dockerfile ."

[tasks.docker-test]
description = "Test solution in the competition environment (1 CPU, 16GB RAM, no network)"
depends = ["docker-build"]
run = """
docker run --rm \
  --cpus="1" \
  --memory="16g" \
  --network=none \
  -e SEQS="${SEQS:-20}" \
  -v "$(pwd)/src:/app/src:ro" \
  -v "$(pwd)/$SP/datasets:/app/datasets:ro" \
  wnn-connectome-scorer
"""

[tasks.submit]
description = "Package src/solution.py + artifacts into submission.zip"
run = """
cd src && zip -r ../submission.zip solution.py *.onnx \
  -x "test_*" "score.py" "bench.py" "__pycache__/*" "*.pyc" && \
echo "Created submission.zip"
"""
